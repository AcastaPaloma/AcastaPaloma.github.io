<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>microbots remote</title>
<style>
  :root { --bg: #111; --ink: #f4f4f4; --dim: #8a8a8a; --btn: #222; --btn2: #2c2c2c; --acc: #3d7cff; --ok: #36c26b; --bad: #e5484d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.3 -apple-system, system-ui, sans-serif;
               overscroll-behavior: none; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  body { display: flex; flex-direction: column; gap: 10px; padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: var(--bad); flex: none; }
  #dot.on { background: var(--ok); }
  #pos { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #steps { display: flex; gap: 5px; margin-left: auto; }
  #steps i { width: 9px; height: 9px; border-radius: 50%; background: var(--btn2); }
  #steps i.on { background: var(--ink); }
  button { font: inherit; color: inherit; border: 0; border-radius: 18px; background: var(--btn); }
  button:active, button.hit { background: var(--btn2); }
  #next { flex: 1; font-size: 64px; font-weight: 300; background: var(--acc); }
  #next:active, #next.hit { filter: brightness(1.25); }
  #back { height: 18vh; font-size: 40px; font-weight: 300; }
  #jump { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  #jump button { height: 46px; border-radius: 12px; font-size: 18px; font-variant-numeric: tabular-nums; }
  #jump button.cur { background: var(--ink); color: var(--bg); }
  #msg { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; background: var(--bg); color: var(--dim); }
  #msg.show { display: grid; }
</style>
</head>
<body>
<header><span id="dot"></span><span id="pos">–</span><span id="steps"></span></header>
<button id="next" aria-label="Next">→</button>
<button id="back" aria-label="Back">←</button>
<div id="jump"></div>
<div id="msg"></div>
<script src="sync.js"></script>
<script>
const B = SYNC.beats, $ = id => document.getElementById(id);
let s = 0, b = 0;
const msg = t => { $('msg').textContent = t; $('msg').classList.add('show'); };
if (SYNC.role !== 'lead') msg('This remote needs its key. Open the full remote link, the one ending in #k=…');
else SYNC.keyOk.then(ok => ok || msg('The key in this link is wrong. Open the full remote link again.'));

B.forEach((_, i) => { const e = document.createElement('button'); e.textContent = i + 1; e.onpointerdown = () => move(i, 0); $('jump').append(e); });
function render() {
  $('pos').textContent = `${s + 1} / ${B.length}`;
  $('steps').innerHTML = B[s] > 1 ? Array.from({ length: B[s] }, (_, i) => `<i class="${i <= b ? 'on' : ''}"></i>`).join('') : '';
  [...$('jump').children].forEach((e, i) => e.classList.toggle('cur', i === s));
}
function move(ns, nb) { s = ns; b = nb; render(); SYNC.send(s, b); navigator.vibrate?.(12); keepAwake(); }
const next = () => b + 1 < B[s] ? move(s, b + 1) : s + 1 < B.length && move(s + 1, 0);
const back = () => b > 0 ? move(s, b - 1) : s > 0 && move(s - 1, B[s - 1] - 1);
$('next').onpointerdown = e => { e.preventDefault(); next(); };
$('back').onpointerdown = e => { e.preventDefault(); back(); };
addEventListener('keydown', e => {   // a Bluetooth clicker or keyboard paired to the phone works too
  if ([' ', 'ArrowRight', 'ArrowDown', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); back(); }
});
document.addEventListener('contextmenu', e => e.preventDefault());

SYNC.listen((ns, nb) => { s = ns; b = nb; render(); });   // someone else (the laptop) moved it
SYNC.onStatus(on => $('dot').classList.toggle('on', on));

let lock = null;   // keep the phone screen on while presenting
async function keepAwake() { try { if (!lock && document.visibilityState === 'visible') { lock = await navigator.wakeLock?.request('screen'); lock?.addEventListener('release', () => lock = null); } } catch {} }
document.addEventListener('visibilitychange', keepAwake);
render();
</script>
</body>
</html>
